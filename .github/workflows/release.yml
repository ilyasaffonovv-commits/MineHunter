name: release
# Publishes a GitHub release when a v* tag is pushed AND no release with that tag exists yet
# (a maintainer may also create the release by hand with `gh release create`, then this workflow does nothing).
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Is there already a release for this tag?
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} --repo ${{ github.repository }} *> $null
          "exists=$($LASTEXITCODE -eq 0)".ToLower() | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/setup-dotnet@v6
        if: steps.exists.outputs.exists != 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Build and self-test
        if: steps.exists.outputs.exists != 'true'
        shell: pwsh
        run: |
          ./build_release.ps1 -Zip
          ./MineHunter-cli.exe selftest
      - name: Publish the release
        if: steps.exists.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/MineHunter-v*.zip | Select-Object -First 1
          $sum = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $zip.Name
          Set-Content dist/SHA256SUMS-release.txt $sum -Encoding ascii
          gh release create ${{ github.ref_name }} $zip.FullName dist/SHA256SUMS-release.txt --title "MineHunter ${{ github.ref_name }}" --generate-notes
