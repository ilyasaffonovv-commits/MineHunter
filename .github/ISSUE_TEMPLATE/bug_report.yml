name: Bug report
description: Something in MineHunter itself does not work (crash, wrong UI, failed cleanup or restore…)
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: MineHunter version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Log / crash text
      description: "The *Log* tab, `%ProgramData%\\MineHunter\\minehunter.log` or `crash.log` (remove private paths first)"
      render: text
